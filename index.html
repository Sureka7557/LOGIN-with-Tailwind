<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Login Form</title>
</head>
<body class="m-[0] p-[0] box-border flex justify-center items-center min-h-screen bg-pink-400 ">
    <div class="w-[450px] h-[480px] p-[30px] border-4 border-solid border-black-600 bg-white  shadow-[12px_12px_0_#000]">
        <h1 class="text-4xl cursor-pointer font-extrabold pb-[10px] hover:scale-101 w-20 border-b-7 border-solid border-black-600 hover:w-30 transition-all duration-300">LOGIN</h1><br>
        <label for="one" class="uppercase text-1.2xl font-extrabold">Email</label>
        <input type="email" id="one" class="w-[370px] h-[50px] mb-[20px] mt-[10px] border-4 border-solid border-black-600">
        <label for="two" class="uppercase text-1.2xl font-extrabold">password</label>
        <input type="password" id="two" class="w-[370px] h-[50px] mt-[10px] border-4 border-solid border-black-600">
        <button type="submit" class="w-[370px] h-[60px] mb-[20px] mt-[30px]  text-2xl font-extrabold cursor-pointer  border-4 border-solid border-black-600 shadow-[7px_7px_0_#000] bg-yellow-300 hover:shadow-none   hover:translate-x-[2px] hover:translate-y-[2px] hover:bg-yellow-200 transition-all duration-150">LOGIN NOW</button>
        <a href="#" class="underline block text-center text-1.5xl font-bold hover:text-gray-700">Do not have an account? SIGN UP</a>
    </div>

</body>
</html>
